[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "novirhyza-batten-local"
version = "0.1.0a2"
requires-python = ">=3.11,<3.15"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
dependencies = ["novirhyza-batten-asgi==0.1.0a2", "novirhyza-batten-umf-postgres==0.1.0a2", "opentelemetry-sdk==1.45.2", "opentelemetry-instrumentation-psycopg==0.66b2", "pgserver-pg18==18.6.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/batten"]
