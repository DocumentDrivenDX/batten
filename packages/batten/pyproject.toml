[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "novirhyza-batten"
version = "0.1.0a3"
description = "Batten application SDK: operation contracts, host runtime, table port and ASGI transport"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
authors = [{name = "Synaptiq"}]
dependencies = ["starlette>=1.10,<2", "uvicorn>=0.54,<1"]

[project.urls]
Repository = "https://github.com/DocumentDrivenDX/batten"

[tool.hatch.build.targets.wheel]
packages = ["src/batten"]
