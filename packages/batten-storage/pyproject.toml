[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "novirhyza-batten-storage"
version = "0.1.0a1"
description = "Batten portable object storage and managed local filesystem adapter"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
authors = [{name = "Synaptiq"}]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/batten"]
