[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "novirhyza-batten-umf-postgres"
version = "0.1.0a2"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
dependencies = ["novirhyza-batten-tables==0.1.0a2", "umf-access>=0.1.0.dev8,<=0.1.0.dev10"]

[project.optional-dependencies]
generated = ["umf-access[generated]==0.1.0.dev10"]
postgresql = ["psycopg[binary]>=3.3.6,<3.4"]
postgresql-writes = ["psycopg[binary]>=3.3.6,<3.4", "umf-access[generated]==0.1.0.dev10"]
local = ["umf-access==0.1.0.dev8", "umf-codegen==0.10.8", "umf-weft==0.4.57", "psycopg[binary]==3.3.7", "pgserver-pg18==18.6.1", "opentelemetry-instrumentation-psycopg==0.66b2"]

[tool.hatch.build.targets.wheel]
packages = ["src/batten"]
