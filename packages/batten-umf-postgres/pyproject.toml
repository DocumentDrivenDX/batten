[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "novirhyza-batten-umf-postgres"
version = "0.1.0a9"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
dependencies = ["novirhyza-batten-tables==0.1.0a5", "umf-access>=0.1.0.dev20,<=0.1.0.dev21", "umf-access-generated-executor==0.1.0a11"]

[project.optional-dependencies]
postgresql = ["psycopg[binary]==3.3.6"]
postgresql-writes = ["psycopg[binary]==3.3.6", "umf-access==0.1.0.dev21"]
local = ["umf-access-build==0.1.0.dev31", "umf-codegen==0.1.0a8", "weft-sql==0.4.67.dev1", "psycopg[binary]==3.3.6", "pgserver-pg18==18.6.1", "opentelemetry-instrumentation-psycopg==0.66b2"]

[tool.hatch.build.targets.wheel]
packages = ["src/batten"]
