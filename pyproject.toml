[project]
name = "batten-development"
version = "0.1.0a2"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = ["ruff==0.17.3", "pyright==1.1.414", "pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "hatchling==1.33.0", "build==1.6.1", "pydantic==2.14.2", "umf-core==0.10.8", "psycopg[binary]==3.3.7", "pgserver-pg18==18.6.1", "opentelemetry-sdk==1.45.2", "umf-weft==0.4.57", "opentelemetry-instrumentation-psycopg==0.66b2"]

[tool.uv]
package = false
find-links = ["https://github.com/DocumentDrivenDX/pgserver/releases/expanded_assets/pg18.6-pgv0.8.6-r2"]

[tool.uv.workspace]
exclude = ["packages/batten-lintel", "packages/batten-umf-postgres", "packages/batten-local", "examples/approval-desk"]
members = ["packages/batten-storage", "packages/batten-contracts", "packages/batten-runtime", "packages/batten-tables", "packages/batten-asgi"]

[tool.uv.sources]
novirhyza-batten-contracts = { workspace = true }
novirhyza-batten-runtime = { workspace = true }
novirhyza-batten-tables = { workspace = true }

[tool.ruff]
target-version = "py311"
preview = true
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR0904"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-returns = 6
max-branches = 9
max-statements = 40
max-public-methods = 15

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["packages", "scripts", "tests", "docs/helix/site", "examples/approval-desk/src"]
venvPath = "."
venv = ".venv"
extraPaths = ["packages/batten-storage/src", "packages/batten-contracts/src", "packages/batten-runtime/src", "packages/batten-tables/src", "packages/batten-asgi/src", "packages/batten-lintel/src", "packages/batten-umf-postgres/src", "packages/batten-local/src", "scripts", "docs/helix/site", "examples/approval-desk/src"]

[tool.pytest.ini_options]
markers = ["integration: requires actual native services and installed browser artifacts"]
pythonpath = ["packages/batten-storage/src", "packages/batten-contracts/src", "packages/batten-runtime/src", "packages/batten-tables/src", "packages/batten-asgi/src", "packages/batten-lintel/src", "packages/batten-umf-postgres/src", "packages/batten-local/src", "scripts", "docs/helix/site", "examples/approval-desk/src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
