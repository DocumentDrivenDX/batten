name: Release

# Runs only on a version tag (v0.1.0a3, ...). A manual dispatch builds and
# smoke-tests but never publishes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and smoke-test only. Publishing happens only from a tag push.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publishing needs a tag
        if: github.ref_type != 'tag' && inputs.dry_run == false
        run: |
          echo "Publishing only happens from a version tag push; re-run with dry_run." >&2
          exit 1
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
      - run: uv sync --frozen --all-packages --python 3.13
      - run: bun install --frozen-lockfile
      - name: Tag matches the one workspace version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            uv run python scripts/check_versions.py "${GITHUB_REF_NAME}"
          else
            uv run python scripts/check_versions.py
          fi
      - run: uv run python scripts/build_dist.py
      - uses: actions/attest-build-provenance@v2
        if: github.ref_type == 'tag'
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Fresh-venv install of the built wheels and the README quickstart
        run: python scripts/smoke_install.py dist

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: smoke
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/novirhyza-batten/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* --title "Batten ${GITHUB_REF_NAME}" \
            --notes-file notes.md --prerelease --verify-tag
