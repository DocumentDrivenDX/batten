name: SDK quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Install build tooling
        run: python -m pip install uv==0.13.7
      - name: Set up Bun
        run: npm install --global bun@1.4.4
      - name: Install selected development tools
        run: |
          uv sync --frozen --all-packages
          bun install --frozen-lockfile
      - name: Assemble pinned optional SDK and application artifacts
        run: uv run python scripts/prepare_approval.py
      - name: Run common quality recipe and behaviors
        run: |
          uv run python scripts/quality.py
      - name: Install native browser
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise installed native approval app
        run: bun run test:native
