name: SDK quality
# PR tier: install + prepare + quality.py (fast smoke, one runner).
# Native browser approval-app test (heavy) runs on tags, dispatch, weekly,
# or on a PR labelled `ci:full`.
on:
  push:
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
jobs:
  check:
    # a bare `labeled` event for an unrelated label should not run anything
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:full'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Install build tooling
        run: python -m pip install uv==0.13.7
      - name: Set up Bun
        run: npm install --global bun@1.4.4
      - name: Install selected development tools
        run: |
          uv sync --frozen --all-packages
          bun install --frozen-lockfile
      - name: Assemble pinned optional SDK and application artifacts
        run: uv run python scripts/prepare_approval.py
      - name: Run common quality recipe and behaviors
        run: |
          uv run python scripts/quality.py
      - name: Install native browser
        if: env.FULL == 'true'
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise installed native approval app
        if: env.FULL == 'true'
        run: bun run test:native
