name: Note/Task release gate
on:
  pull_request:
    paths:
      - '.github/workflows/note-task-release.yml'
      - 'scripts/note_task_gate/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/note-task-release.yml'
      - 'scripts/note_task_gate/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packet-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Verify durable packet and shared source
        run: bash scripts/note_task_gate/ci.sh verify "$RUNNER_TEMP/note-task-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Upload preflight receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: note-task-preflight
          path: ${{ runner.temp }}/note-task-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json

  qualify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'DocumentDrivenDX/batten'
    needs: packet-preflight
    strategy:
      fail-fast: false
      matrix:
        target: [macos, linux, apps, workers]
    runs-on: [self-hosted, "batten-note-task-${{ matrix.target }}"]
    environment: note-task-${{ matrix.target }}
    concurrency:
      group: batten-note-task-${{ matrix.target }}
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run target and verify cleanup
        env:
          BATTEN_GATE_PYTHON: ${{ vars.BATTEN_GATE_PYTHON }}
          BATTEN_GATE_UV: ${{ vars.BATTEN_GATE_UV }}
          BATTEN_GATE_PG_BIN: ${{ vars.BATTEN_GATE_PG_BIN }}
          BATTEN_DATABRICKS_APP: ${{ vars.BATTEN_DATABRICKS_APP }}
          BATTEN_DATABRICKS_HOST: ${{ vars.BATTEN_DATABRICKS_HOST }}
          BATTEN_DATABRICKS_WORKSPACE_ID: ${{ vars.BATTEN_DATABRICKS_WORKSPACE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET: ${{ matrix.target }}
        run: bash scripts/note_task_gate/ci.sh "$TARGET" "$RUNNER_TEMP/note-task-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$TARGET"
      - name: Upload target receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: note-task-${{ matrix.target }}
          path: ${{ runner.temp }}/note-task-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}/receipt.json
          if-no-files-found: ignore
